project:
  type: website
  output-dir: _site

website:
  title: "Siddharth Raina"
  description: "Building and auditing evaluations for tool-using agents, with a focus on measurement validity."
  site-url: "https://raina-sid.github.io"
  # Drafts (`draft: true` in a post's front matter) are NOT published: `gone` makes Quarto emit
  # an empty HTML shell, so draft content never reaches the live site. Switch to `unlinked`
  # locally to preview a draft in full -- but switch back BEFORE publishing, because
  # `unlinked` renders the draft at a real (if unlisted) URL.
  draft-mode: gone
  navbar:
    right:
      - text: Method
        href: method.qmd
      - text: Writing
        href: writing.qmd
      - text: About
        href: about.qmd
      - icon: github
        href: https://github.com/raina-sid
  page-footer:
    center: "Siddharth Raina"
  # Link previews. Without these, shares on LinkedIn/Slack/X render as a bare URL.
  open-graph:
    image: /og-card.png
    image-width: 1200
    image-height: 630
  twitter-card:
    card-style: summary_large_image
    image: /og-card.png

format:
  html:
    # DARK IS LISTED FIRST, so it is the default. That is the fix for "I have to toggle on every
    # page": Quarto does persist the choice in localStorage, but a visitor's FIRST load gets the
    # default, and over file:// the browser treats each page as its own origin so nothing persists
    # at all. Defaulting to dark makes the toggle a courtesy rather than a chore.
    #
    # Monochrome: the .scss files override the Bootswatch palettes to black/white with a black
    # banner in both modes. Hue is removed entirely -- only lightness varies.
    theme:
      dark: [darkly, theme-dark.scss]
      light: [cosmo, theme-light.scss]
    # Syntax colouring is the last source of hue. `none` keeps code monochrome; swap for `github`
    # or `atom-one` if the tradeoff reads wrong on the code-heavy first post.
    highlight-style: none
    css: styles.css
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    link-external-newwindow: true

# Bibliography support is configured now so the survey can use it later
# without restructuring: add `bibliography: references.bib` to a post's front
# matter and cite with [@key].
citation-style: chicago-author-date
