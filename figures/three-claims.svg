<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 656 214" color="#ffffff" role="img" aria-label="An eval makes three claims -- harness, benchmark, metric -- and each has its own failure mode.">
<g font-family="system-ui, sans-serif" fill="currentColor">
<rect x="0" y="30" width="196" height="92" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" rx="2"/>
<text x="14" y="56" font-size="14" font-weight="600">Harness</text>
<text x="14" y="78" font-size="12" opacity="0.75">Did the model know</text>
<text x="14" y="95" font-size="12" opacity="0.75">what we intended?</text>
<line x1="98.0" y1="122" x2="98.0" y2="146" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
<text x="98.0" y="164" font-size="11.5" text-anchor="middle" opacity="0.6">the control can be</text>
<text x="98.0" y="180" font-size="11.5" text-anchor="middle" opacity="0.6">skipped silently</text>
<path d="M202.0 72 l6 4 -6 4" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<rect x="218" y="30" width="196" height="92" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" rx="2"/>
<text x="232" y="56" font-size="14" font-weight="600">Benchmark</text>
<text x="232" y="78" font-size="12" opacity="0.75">Does the task still</text>
<text x="232" y="95" font-size="12" opacity="0.75">elicit the behaviour?</text>
<line x1="316.0" y1="122" x2="316.0" y2="146" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
<text x="316.0" y="164" font-size="11.5" text-anchor="middle" opacity="0.6">the task saturates,</text>
<text x="316.0" y="180" font-size="11.5" text-anchor="middle" opacity="0.6">the zero misleads</text>
<path d="M420.0 72 l6 4 -6 4" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.5"/>
<rect x="436" y="30" width="196" height="92" fill="none" stroke="currentColor" stroke-width="1" opacity="0.35" rx="2"/>
<text x="450" y="56" font-size="14" font-weight="600">Metric</text>
<text x="450" y="78" font-size="12" opacity="0.75">Does the scorer see it</text>
<text x="450" y="95" font-size="12" opacity="0.75">when it happens?</text>
<line x1="534.0" y1="122" x2="534.0" y2="146" stroke="currentColor" stroke-width="1" opacity="0.3" stroke-dasharray="2 3"/>
<text x="534.0" y="164" font-size="11.5" text-anchor="middle" opacity="0.6">derived information</text>
<text x="534.0" y="180" font-size="11.5" text-anchor="middle" opacity="0.6">flows past the match</text>
<text x="0" y="208" font-size="11.5" opacity="0.55">Each can fail while the run reports success.</text>
</g></svg>
